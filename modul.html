<title>Modul pindah ke Kelas — Hanif Dossier Crypto</title>

<!-- Isi 9 modul kerangka arsitektur Web3 dipindahkan ke kelas/metode.js pada
     20 September 2026 dan sekarang jadi kategori "Metode Riset Hanif Dossier"
     di kelas.html: lima kursus, sembilan pelajaran, lengkap dengan kuis.
     Halaman ini disisakan sebagai pengalih supaya tautan dan bookmark lama,
     termasuk modul.html?m=4, tidak putus. -->
<script>
  // Nomor modul lama dipetakan ke kursus barunya. Modul 1-2 jadi Urutan Berpikir,
  // 3-4 Jantung dan Nilai, 5-6 Struktur Suplai dan Siklus, 7-8 Makro dan Bias Diri,
  // 9 Trading Naratif.
  var KURSUS = ['urutan-riset', 'urutan-riset', 'jantung-nilai', 'jantung-nilai',
                'suplai-siklus', 'suplai-siklus', 'makro-bias', 'makro-bias', 'naratif'];
  var m = parseInt(new URLSearchParams(location.search).get('m'), 10);
  // Nomor pelajaran di hash kelas.html mulai dari 1 (lihat rutenya: Number(sub) - 1).
  // Modul ganjil jadi pelajaran 1 di kursusnya, modul genap jadi pelajaran 2.
  var ke = m >= 1 && m <= 9
    ? 'kelas.html#kelas/' + KURSUS[m - 1] + '/' + (m === 9 ? 1 : ((m - 1) % 2) + 1)
    : 'kelas.html#kategori/metode';
  location.replace(ke);
</script>
<link rel="stylesheet" href="gaya.css">
</head>
<body>
<main class="bungkus" style="max-width:640px;padding-block:80px;text-align:center">
  <h1 class="serif">Modul sekarang ada di Kelas</h1>
  <p>Sembilan modul kerangka arsitektur Web3 dipindahkan menjadi kategori
     <b>Metode Riset Hanif Dossier</b> di halaman Kelas, lengkap dengan kuis di tiap kursus.</p>
  <p><a class="utama" href="kelas.html#kategori/metode">Buka Metode Riset &rarr;</a></p>
</main>
</body>
</html>
