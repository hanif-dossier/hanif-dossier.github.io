<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Laporan — Hanif Dossier Crypto</title>
<style>
body{margin:0;background:#f6f5f0;color:#2b3330;font:16px/1.6 "Nunito Sans","Segoe UI",system-ui,sans-serif}
.memuat{max-width:520px;margin:18vh auto;text-align:center;padding:0 20px}
.memuat .putar{width:40px;height:40px;border:4px solid #dfe9e1;border-top-color:#4f7a68;border-radius:50%;margin:0 auto 16px;animation:p 1s linear infinite}
@keyframes p{to{transform:rotate(360deg)}}
.memuat p{color:#7b8781}
.memuat a{color:#4f7a68;font-weight:700}
</style>

<!-- aplikasi: bisa dipasang di HP/desktop; menu pil berikon -->
<meta name="theme-color" content="#4f7a68">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Hanif Dossier">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="ikon-180.png?v=1">
<link rel="stylesheet" href="aplikasi.css?v=4">
<script src="aplikasi.js?v=4" defer></script>
</head>
<body>
<div class="memuat" id="memuat"><div class="putar"></div><p id="teks">Membuka laporan…</p></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="akun.js"></script>
<script>
// Penampil laporan untuk anggota. Halaman laporan (briefing, radar,
// schedule, screening) dibangun GitHub Actions lalu disimpan di gudang
// privat Supabase; di sini diunduh dengan sesi anggota dan digambar utuh.
// Tautan antarhalaman di dalamnya diarahkan kembali ke penampil ini.
(async () => {
  // 'peringatan' dipertahankan sebagai nama lama supaya tautan tersimpan tetap sampai ke Schedule.
  const PETA = { briefing: 'briefing.html', radar: 'radar.html', schedule: 'schedule.html', peringatan: 'schedule.html', screening: 'screening.html' };
  const h = new URLSearchParams(location.search).get('h') || 'briefing';
  const nama = PETA[h] || PETA.briefing;
  const profil = await akun.wajibMasuk();
  try {
    let html = await akun.unduh(nama);
    html = html
      .replace(/href="(?:https:\/\/hanif-dossier\.github\.io\/laporan-harian\/)?index\.html"/g, 'href="laporan.html?h=briefing"')
      .replace(/href="(?:https:\/\/hanif-dossier\.github\.io\/laporan-harian\/)?radar\.html"/g, 'href="laporan.html?h=radar"')
      .replace(/href="(?:https:\/\/hanif-dossier\.github\.io\/laporan-harian\/)?(?:schedule|peringatan)\.html"/g, 'href="laporan.html?h=schedule"')
      .replace(/href="https:\/\/hanif-dossier\.github\.io\/potret-pasar-crypto\/?"/g, 'href="laporan.html?h=screening"')
      .replace(/href="https:\/\/hanif-dossier\.github\.io\/laporan-harian\/?"/g, 'href="laporan.html?h=briefing"');
    document.open(); document.write(html); document.close();
    // Menu anggota: dokumen laporan punya header.atas + nav.menu sendiri (5 tautan publik).
    // Isinya diganti dengan menu pil lengkap yang sama dengan halaman lain — satu header, bukan dua.
    // Kalau laporan tidak punya nav.menu (templat lama), bilah anggota dipasang di atasnya.
    try {
      const h2 = document.head, l = document.createElement('link'); l.rel = 'stylesheet'; l.href = 'aplikasi.css?v=4'; h2.appendChild(l);
      document.getElementById('memuat')?.remove();
      const aktif = k => k === h || (h === 'peringatan' && k === 'schedule') ? ' class="aktif"' : '';
      const tautan = '<a href="dasbor.html">Beranda</a><a' + aktif('briefing') + ' href="laporan.html?h=briefing">Briefing</a><a' + aktif('radar') + ' href="laporan.html?h=radar">Radar</a><a' + aktif('schedule') + ' href="laporan.html?h=schedule">Schedule</a><a' + aktif('screening') + ' href="laporan.html?h=screening">Screening</a><a href="pasar.html">Pasar</a><a href="bitcoin.html">Bitcoin</a><a href="kelas.html">Kelas</a><a href="modul.html">Modul</a><a href="kuis.html">Kuis</a>' +
        (profil.disetujui ? '<a href="pustaka.html">Pustaka</a>' : '') + (profil.admin ? '<a href="admin.html">Anggota</a>' : '') + '<a href="pengaturan.html">Pengaturan</a><a href="tentang.html">Tentang</a><a href="#" data-keluar>Keluar</a>';
      let nav = document.querySelector('header.atas nav.menu');
      if (nav) {
        nav.innerHTML = tautan;
        const merek = document.querySelector('header.atas .merek'); if (merek) merek.setAttribute('href', 'dasbor.html');
      } else {
        const bar = document.createElement('header'); bar.className = 'bar-anggota';
        bar.innerHTML = '<a class="merek-kecil" href="dasbor.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4f7a68" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c-4 4-7 7-7 11a7 7 0 0 0 14 0c0-4-3-7-7-11z"/><path d="M12 21V11"/></svg><b>Hanif Dossier</b></a><nav class="menu">' + tautan + '</nav>';
        document.body.prepend(bar); nav = bar.querySelector('nav.menu');
      }
      nav.querySelector('[data-keluar]').addEventListener('click', e => { e.preventDefault(); akun.keluar(); });
      const sk = document.createElement('script'); sk.src = 'aplikasi.js?v=4'; h2.appendChild(sk);
    } catch (e) { console.warn('bilah anggota:', e); }
  } catch (e) {
    document.getElementById('teks').innerHTML = `Laporan belum tersedia di gudang (${e.message}).<br>Biasanya terbit tiap pagi. <a href="index.html">Kembali ke beranda</a>`;
    document.querySelector('.putar').style.display = 'none';
  }
})();
</script>
</body>
</html>
