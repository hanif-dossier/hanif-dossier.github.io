<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Buat kata sandi — Hanif Dossier Crypto</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='32' fill='%23dfe9e1'/%3E%3Cpath d='M32 12c-10 10-17 17-17 26a17 17 0 0 0 34 0c0-9-7-16-17-26z' fill='none' stroke='%234f7a68' stroke-width='5' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Nunito+Sans:wght@400;600;700&display=swap">
<style>
:root{color-scheme:light;--bg:#f6f5f0;--bg2:#eef2ec;--kartu:#fff;--tx:#2b3330;--tx2:#58635e;--lb:#7b8781;--gr:#e6e9e4;--lembut:#eef2ec;--sage:#4f7a68;--sage-tua:#365446;--sage-lembut:#dfe9e1;--bata:#b86b5c;--bata-lembut:#f6e4df;--bayang:0 10px 30px rgba(43,51,48,.06)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:linear-gradient(180deg,var(--bg),var(--bg2));color:var(--tx);font:16px/1.6 "Nunito Sans","Segoe UI",system-ui,sans-serif;display:flex;flex-direction:column}
.serif{font-family:"DM Serif Display",Georgia,serif;font-weight:400}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:28px 16px}
.kotak{width:100%;max-width:440px}
.merek{display:flex;align-items:center;gap:12px;margin-bottom:22px;justify-content:center}
.merek .daun{width:44px;height:44px;border-radius:50%;background:var(--sage-lembut);display:grid;place-items:center}
.merek b{display:block;font-size:16px}.merek small{color:var(--lb);font-size:12px}
.kartu{background:var(--kartu);border-radius:24px;padding:26px 26px 22px;box-shadow:var(--bayang)}
h1{font-size:1.7rem;margin:0 0 4px;line-height:1.15}
p.sub{margin:0 0 18px;color:var(--tx2);font-size:14px}
label{display:block;font-size:13px;font-weight:700;color:var(--tx2);margin:12px 0 5px}
input{width:100%;padding:12px 14px;border:1px solid #d9dfda;border-radius:12px;font:inherit;font-size:15px;background:#fff;color:var(--tx)}
input:focus{outline:2px solid var(--sage);border-color:var(--sage)}
button.utama{width:100%;margin-top:18px;padding:13px;border:0;border-radius:12px;background:var(--sage);color:#fff;font:inherit;font-weight:700;font-size:15px;cursor:pointer}
button.utama:disabled{opacity:.6;cursor:wait}
.pesan{margin-top:14px;padding:10px 12px;border-radius:12px;font-size:14px;display:none}
.pesan.salah{display:block;background:var(--bata-lembut);color:var(--bata)}
.pesan.baik{display:block;background:var(--sage-lembut);color:var(--sage-tua)}
.tautan{margin-top:16px;font-size:13px;color:var(--lb);text-align:center}
.tautan a{color:var(--sage);font-weight:700;text-decoration:none}
.kaki{text-align:center;font-size:12px;color:#a3aca7;padding:16px}
</style>
</head>
<body>
<main>
  <div class="kotak">
    <div class="merek">
      <div class="daun"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#4f7a68" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c-4 4-7 7-7 11a7 7 0 0 0 14 0c0-4-3-7-7-11z"/><path d="M12 21V11"/></svg></div>
      <div><b>Hanif Dossier Crypto</b><small>pusat laporan pasar crypto · khusus anggota</small></div>
    </div>
    <div class="kartu">
      <h1 class="serif" id="judul">Buat kata sandi</h1>
      <p class="sub" id="sub">Selamat datang. Buat kata sandi supaya lain kali Anda bisa masuk langsung dengan email dan kata sandi.</p>
      <form id="form">
        <label for="sandi">Kata sandi baru</label><input id="sandi" type="password" required minlength="6" autocomplete="new-password" placeholder="minimal 6 karakter">
        <label for="ulang">Ulangi kata sandi</label><input id="ulang" type="password" required minlength="6" autocomplete="new-password" placeholder="ketik sekali lagi">
        <button class="utama" id="kirim" type="submit">Simpan dan masuk</button>
      </form>
      <div class="pesan" id="pesan"></div>
      <div class="tautan"><a href="dasbor.html">Lewati untuk sekarang</a></div>
    </div>
  </div>
</main>
<div class="kaki">Riset dan analisis, bukan nasihat investasi berizin.</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="akun.js"></script>
<script>
// Halaman pendaratan tautan undangan dan tautan "lupa kata sandi": pengguna
// sudah masuk lewat tautan sekali pakai, lalu membuat kata sandi di sini.
(async () => {
  const $ = id => document.getElementById(id);
  const pesan = (t, j) => { const p = $('pesan'); p.textContent = t; p.className = 'pesan ' + j; };
  // Tunggu supabase-js membaca token dari tautan (hash) dan membentuk sesi.
  let sesi = null;
  for (let i = 0; i < 20 && !sesi; i++) { sesi = await akun.sesi(); if (!sesi) await new Promise(r => setTimeout(r, 250)); }
  if (!sesi) { location.replace('masuk.html'); return; }
  if (location.hash.includes('type=recovery')) { $('judul').textContent = 'Ganti kata sandi'; $('sub').textContent = 'Masukkan kata sandi baru untuk akun Anda.'; }
  $('form').addEventListener('submit', async e => {
    e.preventDefault();
    if ($('sandi').value !== $('ulang').value) return pesan('Kata sandi tidak sama. Coba lagi.', 'salah');
    $('kirim').disabled = true;
    const { error } = await akun.sb.auth.updateUser({ password: $('sandi').value });
    if (error) { pesan(error.message, 'salah'); $('kirim').disabled = false; return; }
    pesan('Kata sandi tersimpan. Mengalihkan ke beranda…', 'baik');
    setTimeout(() => location.replace('dasbor.html'), 900);
  });
})();
</script>
</body>
</html>
