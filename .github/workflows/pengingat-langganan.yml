# DIMATIKAN 24 Sep 2026: situs gratis, tidak ada langganan yang perlu diingatkan.
# Jadwalnya dihapus; tinggal bisa dijalankan manual bila diperlukan (arsip).
name: pengingat-langganan
on:
  workflow_dispatch:
jobs:
  ingatkan:
    runs-on: ubuntu-latest
    steps:
      - name: Panggil bot
        env:
          RAHASIA: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
        run: |
          curl -sS -m 120 "https://fqpktykrkpqaztnpqgxz.supabase.co/functions/v1/telegram-langganan?tugas=pengingat" \
            -H "x-telegram-bot-api-secret-token: $RAHASIA"
