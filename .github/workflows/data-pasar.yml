# Menarik data pasar (DefiLlama, CoinGecko, alternative.me) tiap pagi dan
# menyimpannya ke data/pasar.json untuk halaman pasar.html.
# Kunci CoinGecko (opsional) dari repository secret COINGECKO_API_KEY.
name: data-pasar
on:
  schedule:
    # GitHub rutin menunda jadwal ±1¾ jam (06:40 → 08:25 WIB). Dimajukan supaya
    # data sudah segar sebelum anggota membuka situs; 06:40 tinggal cadangan.
    - cron: '47 21 * * *'   # 04:47 WIB
    - cron: '40 23 * * *'   # 06:40 WIB - cadangan
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: data-pasar
  cancel-in-progress: false
jobs:
  tarik:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Lapor ke Kantor AI (mulai)
        env: { KANTOR_KUNCI: "${{ secrets.KANTOR_KUNCI }}" }
        run: node scripts/kantor-lapor.mjs pasar kerja "Menarik data pasar untuk halaman Pasar"

      - name: Tarik data pasar
        env:
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
        run: node scripts/data-pasar.mjs
      - name: Simpan
        run: |
          git config user.name "data-pasar bot"
          git config user.email "bot@hanif-dossier.github.io"
          git add data/pasar.json data/sektor-riwayat.json data/koin.json data/musim-altcoin.json
          git diff --cached --quiet && echo "tidak ada perubahan" && exit 0
          git commit -m "data pasar $(TZ=Asia/Jakarta date +'%Y-%m-%d %H:%M') WIB"
          git pull --rebase origin main
          git push origin main
      - name: Lapor ke Kantor AI (hasil)
        if: always()
        env: { KANTOR_KUNCI: "${{ secrets.KANTOR_KUNCI }}" }
        run: node scripts/kantor-lapor.mjs pasar "${{ job.status == 'success' && 'selesai' || 'gagal' }}" "Data pasar $(TZ=Asia/Jakarta date '+%d %b %H:%M')" "${{ job.status == 'success' && 'Harga, sektor, dan musim altcoin diperbarui' || 'Tarikan data gagal, lihat log GitHub' }}" "https://hanif-dossier.github.io/pasar.html"
