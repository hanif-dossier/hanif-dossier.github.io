# Menarik data pasar (DefiLlama, CoinGecko, alternative.me) tiap pagi dan
# menyimpannya ke data/pasar.json untuk halaman pasar.html.
# Kunci CoinGecko (opsional) dari repository secret COINGECKO_API_KEY.
name: data-pasar
on:
  schedule:
    - cron: '40 23 * * *'   # 06:40 WIB
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: data-pasar
  cancel-in-progress: false
jobs:
  tarik:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Tarik data pasar
        env:
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
        run: node scripts/data-pasar.mjs
      - name: Simpan
        run: |
          git config user.name "data-pasar bot"
          git config user.email "bot@hanif-dossier.github.io"
          git add data/pasar.json
          git diff --cached --quiet && echo "tidak ada perubahan" && exit 0
          git commit -m "data pasar $(TZ=Asia/Jakarta date +'%Y-%m-%d %H:%M') WIB"
          git pull --rebase origin main
          git push origin main
